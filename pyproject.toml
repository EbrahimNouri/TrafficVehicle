[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-vehicle-classifier"
version = "1.0.0"
description = "Leakage-aware CNN and transfer-learning traffic vehicle classifier"
requires-python = ">=3.11"
dependencies = [
  "torch==2.14.1",
  "torchvision==0.29.1",
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "Pillow>=10",
  "nbformat>=5.10",
  "nbclient>=0.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
  "requests>=2.34.2",
  "tqdm>=4.70.1",
]

[tool.setuptools.packages.find]
include = ["traffic_classifier*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
